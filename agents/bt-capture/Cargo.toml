[package]
name = "bt-capture"
version = "0.1.0"
edition = "2021"
authors = ["BlueScope Team"]
description = "High-performance Bluetooth capture agent"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Bluetooth & USB
btleplug = "0.11"
rusb = "0.9"
serialport = "4.3"

# Networking
tonic = "0.10"
prost = "0.12"

# Data structures
bytes = "1.5"
ringbuf = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.13"
toml = "0.8"

# Crypto (for secure upload)
ring = "0.17"
base64 = "0.21"

# Metrics
prometheus = "0.13"

# Signal processing (for RF analysis)
rustfft = "6.1"

[build-dependencies]
tonic-build = "0.10"

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "bt-capture"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
